<svg xmlns="http://www.w3.org/2000/svg" width="192" height="32" viewBox="0 0 192 32">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8a8a"/>
      <stop offset="50%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="white" opacity="0.15"/>
      <circle cx="12" cy="12" r="1" fill="white" opacity="0.15"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="190" height="30" rx="6" fill="url(#stone)" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="1" y="1" width="190" height="30" rx="6" fill="url(#dots)"/>
  <line x1="32" y1="4" x2="32" y2="28" stroke="#3a3a3a" stroke-width="1.5" opacity="0.6"/>
  <line x1="64" y1="4" x2="64" y2="28" stroke="#3a3a3a" stroke-width="1.5" opacity="0.6"/>
  <line x1="96" y1="4" x2="96" y2="28" stroke="#3a3a3a" stroke-width="1.5" opacity="0.6"/>
  <line x1="128" y1="4" x2="128" y2="28" stroke="#3a3a3a" stroke-width="1.5" opacity="0.6"/>
  <line x1="160" y1="4" x2="160" y2="28" stroke="#3a3a3a" stroke-width="1.5" opacity="0.6"/>
  <!-- side bolts -->
  <circle cx="10" cy="8" r="2.5" fill="#2a2a2a"/><circle cx="10" cy="24" r="2.5" fill="#2a2a2a"/>
  <circle cx="182" cy="8" r="2.5" fill="#2a2a2a"/><circle cx="182" cy="24" r="2.5" fill="#2a2a2a"/>
</svg>
